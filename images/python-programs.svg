<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" rx="8" fill="#0f172a"/><text x="28" y="43" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="21">Interactive Python programs</text><g fill="#f8fafc" font-family="Consolas, Courier New, monospace" font-size="19" xml:space="preserve"><text x="28" y="105">def calculator(n1, n2, op):</text><text x="28" y="133">  if op == &quot;+&quot;:</text><text x="28" y="161">    return n1 + n2</text><text x="28" y="189">  elif op == &quot;-&quot;:</text><text x="28" y="217">    return n1 - n2</text></g></svg>